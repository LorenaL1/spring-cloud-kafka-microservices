spring.application.name=products-command
server.port=8081

#database
spring.datasource.url=jdbc:mysql://mysql-kafka:3306/db_spring_kafka
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#kafka
spring.cloud.function.definition=handleCommands
spring.cloud.stream.bindings.handleCommands-in-0.destination=products.commands
spring.cloud.stream.bindings.handleCommands-in-0.contentType=application/json
spring.cloud.stream.bindings.handleCommands-in-0.group=products-command

# Kafka consumer properties
spring.cloud.stream.kafka.bindings.handleCommands-in-0.consumer.startOffset=latest

spring.cloud.stream.bindings.handleCommands-out-0.destination=products.replies
spring.cloud.stream.bindings.handleCommands-out-0.contentType=application/json

# Kafka Broker
spring.cloud.stream.kafka.binder.brokers=kafka:19092